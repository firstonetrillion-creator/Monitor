[project]
name = "cerrado-aberto-coleta"
version = "0.1.0"
description = "Cerrado Aberto — Coletores resilientes, normalização e qualidade de dados públicos legislativos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerrado_aberto_coleta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: testes que realizam chamadas de rede reais (desabilitados por padrão)",
]
addopts = "-m 'not integration'"
