[project]
name = "cerrado-aberto-api"
version = "0.1.0"
description = "Cerrado Aberto — API pública somente leitura (FastAPI + PostgreSQL 16) de transparência legislativa"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "tzdata>=2024.1",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerrado_aberto_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../coleta/src"]
