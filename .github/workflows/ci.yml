name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Docs & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate markdown links, repo paths, and JSON files
        run: node scripts/validate-docs.mjs
      - name: Ensure no local machine paths leak in documentation
        run: |
          if grep -rnE "file:///|C:\\\\Users|c:/Users" README.md AGENTS.md CONTRIBUTING.md SECURITY.md docs/; then
            echo "Found forbidden local path references in documentation."
            exit 1
          fi

  coleta:
    name: Coleta (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --directory apps/coleta --extra dev
      - name: Ruff lint
        run: uv run --directory apps/coleta ruff check src tests
      - name: Pytest (offline & fixtures suite)
        run: |
          uv run --directory apps/coleta pytest -q \
            tests/test_nexlegis_pipeline.py \
            tests/test_regras_negocio_adr005.py \
            tests/test_nexlegis_incremental.py \
            tests/test_transparencia_2026.py \
            tests/test_fase5_coleta.py \
            -k "not persistencia_bairros_e_normas and not persistencia_postgres_transparencia_2026"

  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --directory apps/api --extra dev
      - name: Ruff lint
        run: uv run --directory apps/api ruff check src tests
      - name: Pytest (deterministic summaries & unit suite)
        run: uv run --directory apps/api pytest -q tests/test_boletins_e_resumos.py -k "not endpoint_boletim_semanal"
      - name: FastAPI app & routes smoke check
        run: |
          uv run --directory apps/api python -c "from cerrado_aberto_api.main import app; paths = sorted(p for p in app.openapi()['paths'] if p.startswith('/api/v1/')); print(f'OpenAPI v1 paths: {len(paths)}'); assert len(paths) == 21, paths"

  web:
    name: Web (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/web ci
      - name: ESLint
        run: npm --prefix apps/web run lint
      - name: Next.js production build
        run: npm --prefix apps/web run build
